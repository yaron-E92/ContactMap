name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Shared workflow policy
    uses: yaron-E92/AutoDev/.github/workflows/profile-baseline.yml@7190410c74ab6674d1c8cc647b178bbc4b5cdd54
    with:
      require_concurrency: true
    permissions:
      contents: read

  product:
    name: Shared .NET + MAUI validation
    needs: [baseline]
    uses: yaron-E92/AutoDev/.github/workflows/profile-maui.yml@7190410c74ab6674d1c8cc647b178bbc4b5cdd54
    with:
      global_json_file: global.json

      headless_enabled: true
      headless_runner: ubuntu-latest
      headless_setup_command: bash scripts/ci-configure-nuget.sh
      headless_restore_command: dotnet restore ContactMap.NoGui.slnf
      headless_build_command: dotnet build ContactMap.NoGui.slnf --configuration Release --no-restore
      headless_test_command: |
        set -euo pipefail
        mkdir -p artifacts/ci/headless
        dotnet test ContactMap.NoGui.slnf \
          --configuration Release \
          --no-build \
          --no-restore \
          --logger trx \
          --results-directory artifacts/ci/headless
        if ! grep -R -Eq '<Counters[^>]*total="[1-9][0-9]*"' artifacts/ci/headless --include='*.trx'; then
          echo "Headless validation executed zero tests." >&2
          exit 1
        fi
      headless_test_results_path: artifacts/ci/headless/**/*.trx

      android_enabled: true
      android_runner: ubuntu-latest
      android_setup_command: |
        set -euo pipefail
        bash scripts/ci-configure-nuget.sh
        dotnet workload install maui-android --skip-manifest-update
        mkdir -p ContactMap.Presentation.Maui/Platforms/Android/Resources/values
        printf '%s\n' '<resources><string name="google_maps_key">ci-placeholder</string></resources>' > ContactMap.Presentation.Maui/Platforms/Android/Resources/values/google_maps_secrets.xml
      android_restore_command: dotnet restore ContactMap.Presentation.Maui/ContactMap.Presentation.Maui.csproj --runtime android-arm64
      android_build_command: dotnet build ContactMap.Presentation.Maui/ContactMap.Presentation.Maui.csproj --configuration Release --framework net10.0-android --runtime android-arm64 --no-restore
      android_test_command: |
        set -euo pipefail
        find ContactMap.Presentation.Maui/bin/Release/net10.0-android -type f -name 'ContactMap.Presentation.Maui.dll' -print -quit | grep -q .

      windows_enabled: true
      windows_runner: windows-latest
      windows_setup_command: |
        set -euo pipefail
        bash scripts/ci-configure-nuget.sh
        dotnet workload install maui --skip-manifest-update
      windows_restore_command: dotnet restore ContactMap.Presentation.Maui/ContactMap.Presentation.Maui.csproj
      windows_build_command: dotnet build ContactMap.Presentation.Maui/ContactMap.Presentation.Maui.csproj --configuration Release --framework net10.0-windows10.0.19041.0 --runtime win-x64
      windows_test_command: |
        set -euo pipefail
        find ContactMap.Presentation.Maui/bin/Release/net10.0-windows10.0.19041.0 -type f -name 'ContactMap.Presentation.Maui.dll' -print -quit | grep -q .
    secrets:
      nuget_token: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read

  ci-gate:
    name: CI gate
    if: always()
    needs: [baseline, product]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require policy and product validation
        shell: bash
        env:
          BASELINE: ${{ needs.baseline.result }}
          PRODUCT: ${{ needs.product.result }}
        run: |
          set -euo pipefail
          if [[ "$BASELINE" != "success" || "$PRODUCT" != "success" ]]; then
            echo "Required ContactMap CI failed: baseline=$BASELINE product=$PRODUCT" >&2
            exit 1
          fi
          echo "ContactMap authoritative CI passed."
