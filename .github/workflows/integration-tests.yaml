name: Run Integration Tests (Manual)

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    name: Shared workflow policy
    uses: yaron-E92/AutoDev/.github/workflows/profile-baseline.yml@7190410c74ab6674d1c8cc647b178bbc4b5cdd54
    with:
      require_concurrency: true
    permissions:
      contents: read

  integration-tests:
    name: Explicit integration suite
    needs: [baseline]
    uses: yaron-E92/AutoDev/.github/workflows/profile-dotnet.yml@7190410c74ab6674d1c8cc647b178bbc4b5cdd54
    with:
      global_json_file: global.json
      setup_command: bash scripts/ci-configure-nuget.sh
      restore_command: dotnet restore ContactMap.IntegrationTests/ContactMap.IntegrationTests.csproj
      build_command: dotnet build ContactMap.IntegrationTests/ContactMap.IntegrationTests.csproj --configuration Release --no-restore
      test_command: |
        set -euo pipefail
        mkdir -p artifacts/ci/integration
        dotnet test ContactMap.IntegrationTests/ContactMap.IntegrationTests.csproj \
          --configuration Release \
          --no-build \
          --no-restore \
          --logger trx \
          --results-directory artifacts/ci/integration \
          --filter TestCategory=Integration
        if ! grep -R -Eq '<Counters[^>]*total="[1-9][0-9]*"' artifacts/ci/integration --include='*.trx'; then
          echo "Explicit integration validation executed zero tests." >&2
          exit 1
        fi
      test_results_path: artifacts/ci/integration/**/*.trx
      artifact_name: contactmap-integration-results
    secrets:
      nuget_token: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
